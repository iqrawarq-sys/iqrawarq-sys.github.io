    <linearGradient id="k-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a868"/><stop offset="1" stop-color="#a06d35"/></linearGradient>
    <linearGradient id="k-dev" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4541"/><stop offset="1" stop-color="#1c2421"/></linearGradient>
    <radialGradient id="k-scr" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1d6b52"/><stop offset="1" stop-color="#0a3427"/></radialGradient>
    <linearGradient id="k-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".42" stop-color="#fff" stop-opacity=".04"/><stop offset=".43" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="k-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3fb98c" stop-opacity=".4"/><stop offset="1" stop-color="#3fb98c" stop-opacity="0"/></radialGradient>
