<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="طفل وطفلة يتعلمان الحروف العربية عن بعد على جهاز لوحي">
  <defs>
    <linearGradient id="k-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6eedb"/><stop offset="1" stop-color="#e8dab8"/></linearGradient>
    <radialGradient id="k-sun" cx=".5" cy=".4" r=".55"><stop offset="0" stop-color="#fff8e3" stop-opacity="1"/><stop offset="1" stop-color="#fff8e3" stop-opacity="0"/></radialGradient>
    <linearGradient id="k-cloth" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ddd5c3"/><stop offset=".3" stop-color="#ffffff"/><stop offset=".65" stop-color="#f8f5ee"/><stop offset="1" stop-color="#d2c9b5"/></linearGradient>
    <linearGradient id="k-scarf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e4dcc8"/><stop offset=".35" stop-color="#fffdf6"/><stop offset="1" stop-color="#ddd3bc"/></linearGradient>
    <linearGradient id="k-green" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155a44"/><stop offset=".4" stop-color="#22785b"/><stop offset="1" stop-color="#124d3a"/></linearGradient>
    <radialGradient id="k-skin" cx=".4" cy=".32" r=".8"><stop offset="0" stop-color="#ebbd92"/><stop offset=".65" stop-color="#d6a274"/><stop offset="1" stop-color="#b98656"/></radialGradient>
